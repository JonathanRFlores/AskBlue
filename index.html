<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskBlue</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #101828;
      --muted: #667085;
      --line: #e4e7ec;
      --panel: #ffffff;
      --soft: #f8fafc;
      --blue: #155eef;
      --blue-dark: #004eeb;
      --blue-soft: #eff4ff;
      --green: #0e9384;
      --amber: #dc6803;
      --red: #d92d20;
      --shadow: 0 24px 70px rgba(16, 24, 40, 0.14);
      --soft-shadow: 0 10px 32px rgba(16, 24, 40, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(239, 244, 255, 0.72) 44%, rgba(246, 248, 252, 1)),
        #f6f8fc;
      color: var(--ink);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(21, 94, 239, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 94, 239, 0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.82), transparent 76%);
    }

    button,
    input {
      font: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto minmax(150px, 1fr);
      align-items: center;
      gap: 16px;
      padding: 16px clamp(14px, 3vw, 34px);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(228, 231, 236, 0.92);
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.03);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      justify-self: start;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(270px, 50vw);
      height: 48px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .brand-logo {
      width: 100%;
      max-height: 34px;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-tagline {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 720;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
      justify-self: center;
    }

    .partner-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(245px, 31vw);
      height: 58px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      flex: 0 0 auto;
      justify-self: end;
    }

    .partner-logo {
      width: 100%;
      max-height: 46px;
      object-fit: contain;
      display: block;
    }

    .status-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.blue {
      background: #edf3ff;
      border-color: #c9d9ff;
      color: var(--blue-dark);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      padding: clamp(12px, 2vw, 24px);
      min-height: 0;
      overflow: hidden;
    }

    .chat {
      width: 100%;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(228, 231, 236, 0.96);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .messages {
      padding: clamp(16px, 2.5vw, 30px);
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: auto;
      background:
        linear-gradient(180deg, rgba(248, 250, 252, 0.8), rgba(255, 255, 255, 0.82));
    }

    .scroll-anchor {
      height: 1px;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 16px;
      animation: messageIn 220ms ease both;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.agent::before {
      content: "";
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 999px;
      background:
        url("assets/icon.png") center / cover no-repeat,
        #0f6fcb;
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 24px rgba(21, 94, 239, 0.24);
    }

    .message-row.agent.is-thinking::before {
      animation: iconThinking 1s ease-in-out infinite;
      box-shadow:
        0 0 0 0 rgba(21, 94, 239, 0.28),
        0 10px 24px rgba(21, 94, 239, 0.24);
    }

    .message {
      max-width: min(840px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.94);
      line-height: 1.48;
      font-size: 0.96rem;
      box-shadow: 0 8px 28px rgba(16, 24, 40, 0.07);
    }

    .message-row.user .message {
      background: linear-gradient(145deg, #155eef, #004eeb);
      color: #fff;
      border-color: #155eef;
      max-width: min(650px, 88%);
      box-shadow: 0 12px 28px rgba(21, 94, 239, 0.22);
    }

    .message-row.agent .message {
      background: rgba(255, 255, 255, 0.96);
    }

    .message-row.agent .message.wide {
      flex: 1 1 auto;
      max-width: none;
      width: 100%;
    }

    .message.typing {
      display: none;
    }

    .message.rendered {
      animation: answerReveal 240ms ease both;
    }

    .message strong {
      font-weight: 760;
    }

    .message p {
      margin: 0 0 10px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 0.98rem;
      font-weight: 780;
    }

    .inline-note {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 28px;
      margin: 0 0 12px;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--blue-soft);
      color: #00359e;
      border: 1px solid #c7d7fe;
      font-size: 0.78rem;
      font-weight: 750;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.05);
    }

    table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.78rem;
    }

    th,
    td {
      text-align: left;
      vertical-align: top;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    th {
      background: #f8fafc;
      color: #344058;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: normal;
    }

    .dashboard-table .col-intern {
      width: 12%;
    }

    .dashboard-table .col-area {
      width: 12%;
    }

    .dashboard-table .col-progress {
      width: 9%;
    }

    .dashboard-table .col-completed {
      width: 14%;
    }

    .dashboard-table .col-focus {
      width: 13%;
    }

    .dashboard-table .col-blockers {
      width: 10%;
    }

    .dashboard-table .col-next {
      width: 17%;
    }

    .dashboard-table .col-action {
      width: 13%;
    }

    .capstone-table .col-capstone-intern {
      width: 16%;
    }

    .capstone-table .col-capstone-recommendation {
      width: 56%;
    }

    .capstone-table .col-capstone-action {
      width: 28%;
    }

    .manager-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.25;
    }

    .manager-summary strong {
      color: #1d2939;
      font-size: 0.78rem;
    }

    .manager-summary span {
      white-space: nowrap;
    }

    .dashboard-controls {
      display: grid;
      gap: 10px;
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
    }

    .dashboard-control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .dashboard-control {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .dashboard-control label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 760;
      text-transform: uppercase;
    }

    .dashboard-control select {
      width: 100%;
      min-height: 36px;
      border: 1px solid #cbd4e2;
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--ink);
      background: #fff;
      outline: none;
      font: inherit;
      font-size: 0.82rem;
    }

    .dashboard-control select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.12);
    }

    .dashboard-count {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 720;
    }

    .empty-row td {
      color: var(--muted);
      font-weight: 720;
      text-align: center;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .dashboard-row:hover td {
      background: #f8fbff;
    }

    .intern-name {
      font-weight: 780;
      color: #1c2940;
      white-space: nowrap;
      line-height: 1.2;
    }

    .role {
      display: block;
      max-width: 100%;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.28;
      white-space: normal;
      overflow-wrap: break-word;
    }

    .meta-stack {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.32;
    }

    .meta-stack strong {
      color: #344058;
      font-size: 0.78rem;
    }

    .workload-note {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.32;
    }

    .recommendation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .recommendation-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.05);
    }

    .recommendation-panel h3,
    .lifecycle-step h3 {
      margin: 0 0 6px;
      color: #344058;
      font-size: 0.78rem;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .recommendation-panel p {
      margin: 0;
    }

    .recommendation-panel ul,
    .intern10-list,
    .lifecycle-step ul {
      margin: 7px 0 0;
      padding-left: 18px;
    }

    .recommendation-panel li,
    .intern10-list li,
    .lifecycle-step li {
      margin: 5px 0;
    }

    .lifecycle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .lifecycle-step {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.05);
    }

    .lifecycle-step.current {
      border-color: #84adff;
      box-shadow: 0 8px 24px rgba(21, 94, 239, 0.12);
    }

    .step-kicker {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-bottom: 8px;
      padding: 3px 8px;
      border-radius: 8px;
      background: #f2f4f7;
      color: #344058;
      font-size: 0.72rem;
      font-weight: 780;
    }

    .lifecycle-step.current .step-kicker {
      background: #eff4ff;
      color: var(--blue-dark);
    }

    .intern10-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .intern10-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .intern10-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid #fedf89;
      background: #fff6e8;
      color: var(--amber);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .intern10-status.done {
      border-color: #a7e6cf;
      background: #eaf7f1;
      color: var(--green);
    }

    .assignment-insight {
      display: grid;
      gap: 5px;
      padding: 10px;
      border: 1px solid #c7d7fe;
      border-radius: 8px;
      background: #f8fbff;
      color: #344058;
      font-size: 0.82rem;
      line-height: 1.36;
    }

    .progress-cell {
      min-width: 0;
    }

    .progress-label {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 2px;
      margin-bottom: 7px;
      font-weight: 760;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: #e7ebf2;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }

    .bar.good span {
      background: var(--green);
    }

    .bar.watch span {
      background: var(--amber);
    }

    .bar.support span {
      background: var(--red);
    }

    .blocker {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 8px;
      background: #fff1f1;
      color: var(--red);
      font-weight: 740;
    }

    .blocker.none {
      background: #eaf7f1;
      color: var(--green);
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .row-action {
      border: 1px solid #b2ccff;
      background: #eff4ff;
      color: var(--blue-dark);
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 0.72rem;
      font-weight: 780;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
    }

    .row-action:hover {
      background: #dbeafe;
      border-color: #84adff;
      transform: translateY(-1px);
    }

    .row-actions .row-action[data-intern-action="assign"],
    .row-actions .row-action.primary[data-intern-action="assign"] {
      background: #eff4ff;
      border-color: #b2ccff;
      color: var(--blue-dark);
    }

    .row-actions .row-action[data-intern-action="assign"]:hover,
    .row-actions .row-action.primary[data-intern-action="assign"]:hover {
      background: #dbeafe;
      border-color: #84adff;
      color: var(--blue-dark);
    }

    .detail-view {
      display: grid;
      gap: 12px;
    }

    .detail-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .detail-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .detail-title h2 {
      margin: 0;
      color: #1f2d47;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 720;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 8px;
      background: #eff4ff;
      color: var(--blue-dark);
      border: 1px solid #c7d7fe;
      font-size: 0.76rem;
      font-weight: 780;
      white-space: nowrap;
    }

    .status-badge.good {
      background: #eaf7f1;
      border-color: #a7e6cf;
      color: var(--green);
    }

    .status-badge.watch {
      background: #fff6e8;
      border-color: #fedf89;
      color: var(--amber);
    }

    .status-badge.support {
      background: #fff1f1;
      border-color: #fecdca;
      color: var(--red);
    }

    .detail-progress {
      display: grid;
      gap: 6px;
      min-width: 150px;
    }

    .detail-progress strong {
      color: #1d2939;
      font-size: 0.86rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-section {
      min-width: 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .detail-section.full {
      grid-column: 1 / -1;
    }

    .detail-section h3 {
      margin: 0 0 6px;
      color: #344058;
      font-size: 0.78rem;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .detail-section p {
      margin: 0;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .quick-actions button {
      border: 1px solid #b2ccff;
      background: #eff4ff;
      color: var(--blue-dark);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.84rem;
      font-weight: 740;
      cursor: pointer;
    }

    .quick-actions button:hover {
      background: #dbeafe;
      border-color: #84adff;
      transform: translateY(-1px);
    }

    .draft {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.05);
    }

    .draft:last-child {
      margin-bottom: 0;
    }

    .draft-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .draft-title strong {
      color: #1f2d47;
    }

    .subject {
      color: var(--blue-dark);
      font-weight: 760;
    }

    .draft-body {
      border-radius: 8px;
      padding: 2px;
      outline: none;
    }

    .draft.editing .draft-body {
      padding: 10px;
      background: #f8fafc;
      box-shadow: inset 0 0 0 2px rgba(21, 94, 239, 0.18);
    }

    .draft-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .draft-status {
      margin-right: auto;
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 740;
    }

    .draft-action {
      border: 1px solid #d0d5dd;
      background: #fff;
      color: #344054;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.82rem;
      font-weight: 740;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .draft-action:hover {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .draft-action.send {
      border-color: #84adff;
      background: var(--blue);
      color: #fff;
    }

    .draft-action.send:hover {
      background: var(--blue-dark);
    }

    .draft-action.loading::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-top-color: #fff;
      animation: buttonSpin 760ms linear infinite;
    }

    .draft-action.send.sent {
      border-color: var(--green);
      background: var(--green);
    }

      [80, 180, 320, 520, 900, 1300, 1800].forEach(delay => runLater(scroll, delay));

    function isDashboardContent(html) {
      return html.includes('class="dashboard-table"');
    }

    function quickActionsHtml(options = {}) {
      const includeDashboard = options.includeDashboard ?? true;
      return `
        <div class="quick-actions">
          <button type="button" data-action="skills">Recommend skills</button>
          <button type="button" data-action="training">Recommend training</button>
          <button type="button" data-action="lifecycle">Task lifecycle</button>
          <button type="button" data-action="intern10">Intern10 plan</button>
          <button type="button" data-action="emails">Draft follow-up emails</button>
          <button type="button" data-action="assignments">Assign new work</button>
          <button type="button" data-action="autoAssign">Auto assign by hours</button>
          <button type="button" data-action="capstones">Recommend capstones</button>
          ${includeDashboard ? '<button type="button" data-action="dashboard">Show dashboard</button>' : ""}
        </div>
      `;
    }

    function appendActionOptions(html) {
      if (html.includes('class="quick-actions"')) return html;
      const includeDashboard = !state.dashboardShown && !isDashboardContent(html);
      return `${html}${quickActionsHtml({ includeDashboard })}`;
    }

    function removeDashboardQuickActions() {
      messages.querySelectorAll('button[data-action="dashboard"]').forEach(button => {
        button.remove();
      });
    }

    function renderBubbleContent(bubble, html) {
      const row = bubble.parentElement;
      if (row) row.classList.remove("is-thinking");
      bubble.innerHTML = html;
      bubble.classList.remove("typing");
      bubble.classList.toggle("wide", isWideContent(html));
      bubble.classList.add("rendered");
      wireScrollAfterAssets(bubble);
      scrollToBottom();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function textToHtml(text) {
      const escaped = escapeHtml(text || "");
      const paragraphs = escaped
        .split(/\n{2,}/)
        .map(part => part.trim())
        .filter(Boolean)
        .map(part => `<p>${part.replace(/\n/g, "<br>")}</p>`);

      return paragraphs.length ? paragraphs.join("") : "<p>I can help with the next manager workflow.</p>";
    }

    function aiContext() {
      return {
        managerVerified: state.verification.complete,
        interns: getInterns().map(intern => ({
          name: intern.name,
          role: intern.role,
          track: getInternTrack(intern),
          functionalArea: getFunctionalArea(intern),
          subPractice: getSubPractice(intern),
          projectPhase: getProjectPhase(intern),
          timelineWeeks: getTimelineWeeks(intern),
          clientInteraction: getClientInteraction(intern),
          hoursPerWeek: getHoursPerWeek(intern),
          progress: intern.progress,
          completed: intern.completed,
          focus: intern.focus,
          blockers: intern.blockers,
          nextStep: intern.nextStep,
          managerAction: intern.managerAction,
          intern10Completed: getIntern10Completed(intern)
        })),
        assignments: state.assignments,
        functionalAreas: Object.keys(functionalAreaCatalog),
        subPracticeTraining: Object.fromEntries(Object.entries(subPracticeCatalog).map(([name, value]) => [name, value.modules])),
        intern10Challenge: intern10Requirements.map(item => ({
          key: item.key,
          label: item.label,
          call: item.call,
          assignment: item.assignment,
          evidence: item.evidence
        }))
      };
    }

    async function requestAiResponse(text) {
      if (!ASKBLUE_AI_ENDPOINT) return false;

      const bubble = addAgentThinkingBubble();

      try {
        const response = await fetch(ASKBLUE_AI_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            context: aiContext(),
            history: state.aiHistory.slice(-8)
          })
        });

        if (!response.ok) {
          throw new Error(`AI endpoint returned ${response.status}`);
        }

        const data = await response.json();
        const reply = data.reply || "I can help with intern progress, assignments, emails, or capstone planning.";
        state.aiHistory.push({ role: "user", content: text });
        state.aiHistory.push({ role: "assistant", content: reply });
        renderBubbleContent(bubble, appendActionOptions(textToHtml(reply)));
        return true;
      } catch (error) {
        renderBubbleContent(bubble, appendActionOptions(`
          <p>I could not reach the AI service right now. You can still use dashboard, assignment, email, and capstone actions from this page.</p>
        `));
        return true;
      }
    }

    function addMessage(sender, html) {
      const row = document.createElement("div");
      row.className = `message-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "message";
      bubble.innerHTML = html;

      row.appendChild(bubble);
      if (messages.insertBefore && scrollAnchor.parentElement === messages) {
        messages.insertBefore(row, scrollAnchor);
      } else {
        messages.appendChild(row);
        messages.appendChild(scrollAnchor);
      }
      wireScrollAfterAssets(bubble);
      scrollToBottom();
      return bubble;
    }

    function addAgentMessage(html, options = {}) {
      const includeActions = options.includeActions ?? state.dashboardShown;
      const finalHtml = includeActions ? appendActionOptions(html) : html;
      const bubble = addAgentThinkingBubble(finalHtml);
      runLater(() => renderBubbleContent(bubble, finalHtml), responseDelay(finalHtml));
      return bubble;
    }

    function addAgentThinkingBubble(html = "") {
      const bubble = addMessage("agent", "");
      const row = bubble.parentElement;
      if (row) row.classList.add("is-thinking");
      bubble.classList.add("typing");
      bubble.classList.toggle("wide", isWideContent(html));
      scrollToBottom();
      return bubble;
    }

    function addUserMessage(text) {
      const bubble = addMessage("user", `<p>${escapeHtml(text)}</p>`);
      scrollToBottom();
      return bubble;
    }

    function internProgressStatus(intern) {
      if (intern.progress >= 80) return { key: "on-track", label: "On track", tone: "good" };
      if (intern.progress >= 60) return { key: "needs-clarity", label: "Needs clarity", tone: "watch" };
      return { key: "needs-support", label: "Needs support", tone: "support" };
    }

    function isInternBlocked(intern) {
      return !intern.blockers.toLowerCase().includes("none");
    }

    function getAssignmentDueDate(intern) {
      return state.assignments[intern.name]?.dueDate || "";
    }

    function compareDashboardInterns(left, right) {
      const sort = state.dashboardFilters.sort;

      if (sort === "progress-asc") {
        return left.progress - right.progress || left.name.localeCompare(right.name);
      }

      if (sort === "name-asc") {
        return left.name.localeCompare(right.name);
      }

      if (sort === "blocker-first") {
        const leftBlocked = isInternBlocked(left) ? 0 : 1;
        const rightBlocked = isInternBlocked(right) ? 0 : 1;
        return leftBlocked - rightBlocked || left.progress - right.progress || left.name.localeCompare(right.name);
      }

      if (sort === "due-date") {
        const leftDue = getAssignmentDueDate(left);
        const rightDue = getAssignmentDueDate(right);
        if (leftDue && rightDue) return leftDue.localeCompare(rightDue) || left.name.localeCompare(right.name);
        if (leftDue) return -1;
        if (rightDue) return 1;
        return left.name.localeCompare(right.name);
      }

      if (sort === "hours-desc") {
        return getHoursPerWeek(right) - getHoursPerWeek(left) || left.name.localeCompare(right.name);
      }

      if (sort === "timeline-asc") {
        return getTimelineWeeks(left) - getTimelineWeeks(right) || left.name.localeCompare(right.name);
      }

      return right.progress - left.progress || left.name.localeCompare(right.name);
    }

    function filteredDashboardInterns(interns) {
      const filters = state.dashboardFilters;
      return interns
        .filter(intern => {
          const status = internProgressStatus(intern);
          const blocked = isInternBlocked(intern);
          const track = getInternTrack(intern);
          const functionalArea = getFunctionalArea(intern);
          const subPractice = getSubPractice(intern);
          const phase = getProjectPhase(intern);

          if (filters.status !== "all" && filters.status !== status.key) return false;
          if (filters.blocker === "blocked" && !blocked) return false;
          if (filters.blocker === "clear" && blocked) return false;
          if (filters.functionalArea !== "all" && filters.functionalArea !== functionalArea) return false;
          if (filters.subPractice !== "all" && filters.subPractice !== subPractice) return false;
          if (filters.phase !== "all" && filters.phase !== phase) return false;
          if (filters.track !== "all" && filters.track !== track) return false;
          return true;
        })
        .sort(compareDashboardInterns);
    }

    function isValidIbmEmail(email) {
      const trimmed = email.trim();
      const validShape = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(trimmed);
      if (!validShape) return false;
      const domain = trimmed.split("@")[1] || "";
      return domain.toLowerCase() === "ibm.com";
    }

    function isValidFullName(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      return parts.length >= 2 && parts.every(part => /[A-Za-z]/.test(part));
    }

    function isValidEmployeeId(value) {
      return /^\d+[A-Za-z]$/.test(value.trim());
    }

    function parseCustomInternNames(text) {
      const match = text.match(/(?:interns?|intern\s+names?)\s*(?:are|=|:|-)\s*([^.;]+)/i);
      if (!match) return [];

      return match[1]
        .split(/,| and /i)
        .map(name => name.trim())
        .filter(name => isValidFullName(name))
        .slice(0, 6);
    }

    function getInterns() {
      const interns = state.customInternNames.length
        ? state.customInternNames.map((name, index) => {
          const template = defaultInterns[index % defaultInterns.length];
          return {
            ...template,
            name
          };
        })
        : defaultInterns;

      return interns.map(intern => {
        const assignment = state.assignments[intern.name];
        if (!assignment) return intern;

        const dueText = assignment.dueDate ? ` (due ${assignment.dueDate})` : "";
        const hoursText = assignment.hoursPerWeek ? `, ${assignment.hoursPerWeek} hrs/week` : "";
        return {
          ...intern,
          projectPhase: assignment.projectPhase || intern.projectPhase,
          clientInteraction: assignment.clientInteraction || intern.clientInteraction,
          hoursPerWeek: assignment.hoursPerWeek || intern.hoursPerWeek,
          timelineWeeks: assignment.timelineWeeks || intern.timelineWeeks,
          focus: `Assigned: ${assignment.title}${dueText}${hoursText}`,
          nextStep: assignment.details || assignment.title,
          managerAction: assignment.dueDate
            ? `Review progress before ${assignment.dueDate} and clear blockers.`
            : "Review progress in the next check-in and clear blockers."
        };
      });
    }

    function findInternByName(internName) {
      return getInterns().find(intern => intern.name === internName);
    }

    function getInternTrack(intern) {
      return intern.track || "";
    }

    function getFunctionalArea(intern) {
      return intern.functionalArea || "ERP";
    }

    function getSubPractice(intern) {
      return intern.subPractice || getFunctionalArea(intern);
    }

    function getProjectPhase(intern) {
      return intern.projectPhase || "Plan";
    }

    function getTimelineWeeks(intern) {
      const weeks = Number(intern.timelineWeeks);
      return Number.isFinite(weeks) && weeks > 0 ? weeks : 4;
    }

    function getClientInteraction(intern) {
      return intern.clientInteraction || "Medium";
    }

    function getHoursPerWeek(intern) {
      const hours = Number(intern.hoursPerWeek);
      if (!Number.isFinite(hours) || hours <= 0) return 8;
      return Math.max(2, Math.min(40, Math.round(hours)));
    }

    function getIntern10Completed(intern) {
      return Array.isArray(intern.intern10Completed) ? intern.intern10Completed : [];
    }

    function getFunctionalAreaInfo(intern) {
      return functionalAreaCatalog[getFunctionalArea(intern)] || functionalAreaCatalog.ERP;
    }

    function getSubPracticeInfo(intern) {
      return subPracticeCatalog[getSubPractice(intern)] || {
        modules: [`${getSubPractice(intern)} fundamentals`, "Project delivery basics", "Consulting communication basics"],
        managerModules: ["Review expectations and acceptance criteria", "Set checkpoint cadence", "Coach final readout"],
        skills: ["Functional vocabulary", "Deliverable quality", "Stakeholder communication"]
      };
    }

    function getWorkloadTier(hours) {
      if (hours <= 5) {
        return {
          label: "Micro assignment",
          scope: "One narrow artifact with a manager review before expansion.",
          dueDays: 10,
          checkpoint: "One 15-minute checkpoint"
        };
      }

      if (hours <= 10) {
        return {
          label: "Focused assignment",
          scope: "One primary deliverable plus evidence, assumptions, and questions.",
          dueDays: 7,
          checkpoint: "One midpoint checkpoint"
        };
      }

      if (hours <= 20) {
        return {
          label: "Sprint assignment",
          scope: "A complete artifact with peer or SME feedback before manager review.",
          dueDays: 5,
          checkpoint: "Two checkpoints"
        };
      }

      return {
        label: "Expanded sprint",
        scope: "A larger artifact plus a short readout, handoff notes, and next-step recommendations.",
        dueDays: 3,
        checkpoint: "Two checkpoints and a final readout"
      };
    }

    function setComposerEnabled(isEnabled) {
      input.disabled = !isEnabled;
      if (sendButton) {
        sendButton.disabled = !isEnabled;
      }
    }

    function clearVerificationError() {
      if (verificationError) {
        verificationError.textContent = "";
        verificationError.hidden = true;
      }
      verificationInputs.forEach(field => {
        field.classList.remove("input-error");
        field.removeAttribute("aria-invalid");
      });
    }

    function setVerificationError(message, field) {
      clearVerificationError();
      if (verificationError) {
        verificationError.textContent = message;
        verificationError.hidden = false;
      }
      if (field) {
        field.classList.add("input-error");
        field.setAttribute("aria-invalid", "true");
        field.focus();
      }
    }

    function openVerificationModal() {
      if (!verificationOverlay) return;
      document.body.classList.add("verification-open");
      verificationOverlay.hidden = false;
      setComposerEnabled(false);
      runLater(() => verificationEmployeeId?.focus(), 80);
    }

    function closeVerificationModal() {
      document.body.classList.remove("verification-open");
      if (verificationOverlay) {
        verificationOverlay.hidden = true;
      }
      setComposerEnabled(true);
      input.focus();
    }

    function handleVerificationFormSubmit(event) {
      event.preventDefault();
      clearVerificationError();

      const employeeId = (verificationEmployeeId?.value || "").trim().toUpperCase();
      const fullName = (verificationFullName?.value || "").trim().replace(/\s+/g, " ");
      const email = (verificationEmail?.value || "").trim().toLowerCase();

      if (!employeeId) {
        setVerificationError("Employee ID cannot be blank. Use numbers followed by one letter, such as 1234E.", verificationEmployeeId);
        return;
      }

      if (!isValidEmployeeId(employeeId)) {
        setVerificationError("Employee ID must be numbers followed by one letter, such as 1234E.", verificationEmployeeId);
        return;
      }

      if (!fullName) {
        setVerificationError("Full name cannot be blank.", verificationFullName);
        return;
      }

      if (!isValidFullName(fullName)) {
        setVerificationError("Full name must include first and last name.", verificationFullName);
        return;
      }

      if (!email) {
        setVerificationError("IBM email cannot be blank.", verificationEmail);
        return;
      }

      if (!isValidIbmEmail(email)) {
        setVerificationError("Please enter a valid IBM email address ending in @ibm.com.", verificationEmail);
        return;
      }

      state.verification.employeeId = employeeId;
      state.verification.fullName = fullName;
      state.verification.email = email;

      if (verificationEmployeeId) verificationEmployeeId.value = employeeId;
      if (verificationFullName) verificationFullName.value = fullName;
      if (verificationEmail) verificationEmail.value = email;

      completeVerification();
    }

    function completeVerification() {
      const wasComplete = state.verification.complete;
      state.verification.complete = true;
      input.placeholder = "Ask for skills, training, task lifecycle, Intern10, or auto assignment";
      closeVerificationModal();
      if (!wasComplete) {
        showDashboard();
      }
    }

      return `

          <strong>Manager verified</strong>
          <span>${escapeHtml(verification.fullName)}</span>
          <span>ID ${escapeHtml(verification.employeeId)}</span>
          <span>${escapeHtml(verification.email)}</span>

      `;
    }

      const functionalAreas = [...new Set(allInterns.map(intern => getFunctionalArea(intern)).filter(Boolean))];
      const subPractices = [...new Set(allInterns.map(intern => getSubPractice(intern)).filter(Boolean))];
      const phases = [...new Set(allInterns.map(intern => getProjectPhase(intern)).filter(Boolean))];
      const trackOptions = tracks.map(track => `
        <option value="${escapeHtml(track)}"${filters.track === track ? " selected" : ""}>${escapeHtml(track)}</option>
      `).join("");
      const functionalAreaOptions = functionalAreas.map(area => `
        <option value="${escapeHtml(area)}"${filters.functionalArea === area ? " selected" : ""}>${escapeHtml(area)}</option>
      `).join("");
      const subPracticeOptions = subPractices.map(practice => `
        <option value="${escapeHtml(practice)}"${filters.subPractice === practice ? " selected" : ""}>${escapeHtml(practice)}</option>
      `).join("");
      const phaseOptions = phases.map(phase => `
        <option value="${escapeHtml(phase)}"${filters.phase === phase ? " selected" : ""}>${escapeHtml(phase)}</option>
      `).join("");

      return `

          <div class="dashboard-control-grid">

              <label>Status</label>
              <select data-dashboard-filter="status">
                <option value="all"${filters.status === "all" ? " selected" : ""}>All statuses</option>
                <option value="on-track"${filters.status === "on-track" ? " selected" : ""}>On track</option>
                <option value="needs-clarity"${filters.status === "needs-clarity" ? " selected" : ""}>Needs clarity</option>
                <option value="needs-support"${filters.status === "needs-support" ? " selected" : ""}>Needs support</option>
              </select>
            </div>
            <div class="dashboard-control">
              <label>Blockers</label>
              <select data-dashboard-filter="blocker">
                <option value="all"${filters.blocker === "all" ? " selected" : ""}>All interns</option>
                <option value="blocked"${filters.blocker === "blocked" ? " selected" : ""}>Has blockers</option>
                <option value="clear"${filters.blocker === "clear" ? " selected" : ""}>No blockers</option>
              </select>
            </div>
            <div class="dashboard-control">
              <label>Functional area</label>
              <select data-dashboard-filter="functionalArea">
                <option value="all"${filters.functionalArea === "all" ? " selected" : ""}>All areas</option>
                ${functionalAreaOptions}
              </select>
            </div>
            <div class="dashboard-control">
              <label>Sub-practice</label>
              <select data-dashboard-filter="subPractice">
                <option value="all"${filters.subPractice === "all" ? " selected" : ""}>All sub-practices</option>
                ${subPracticeOptions}
              </select>
            </div>
            <div class="dashboard-control">
              <label>Phase</label>
              <select data-dashboard-filter="phase">
                <option value="all"${filters.phase === "all" ? " selected" : ""}>All phases</option>
                ${phaseOptions}
              </select>
            </div>
            <div class="dashboard-control">
              <label>Track</label>
              <select data-dashboard-filter="track">
                <option value="all"${filters.track === "all" ? " selected" : ""}>All tracks</option>
                ${trackOptions}
              </select>
            </div>
            <div class="dashboard-control">
              <label>Sort</label>
              <select data-dashboard-filter="sort">
                <option value="progress-desc"${filters.sort === "progress-desc" ? " selected" : ""}>Progress high to low</option>
                <option value="progress-asc"${filters.sort === "progress-asc" ? " selected" : ""}>Progress low to high</option>
                <option value="name-asc"${filters.sort === "name-asc" ? " selected" : ""}>Name A-Z</option>
                <option value="blocker-first"${filters.sort === "blocker-first" ? " selected" : ""}>Blockers first</option>
                <option value="due-date"${filters.sort === "due-date" ? " selected" : ""}>Due date</option>
                <option value="hours-desc"${filters.sort === "hours-desc" ? " selected" : ""}>Hours high to low</option>
                <option value="timeline-asc"${filters.sort === "timeline-asc" ? " selected" : ""}>Timeline shortest first</option>
              </select>
            </div>
          </div>
          <div class="dashboard-count">Showing ${visibleInterns.length} of ${allInterns.length} interns</div>
        </div>
      `;
    }

    function dashboardRowActionsHtml(intern) {
      const internName = escapeHtml(intern.name);
      return `
        <div class="row-actions" aria-label="Actions for ${internName}">
          <button type="button" class="row-action" data-intern-action="details" data-intern-name="${internName}">Details</button>
          <button type="button" class="row-action" data-intern-action="skills" data-intern-name="${internName}">Skills</button>
          <button type="button" class="row-action" data-intern-action="training" data-intern-name="${internName}">Training</button>
          <button type="button" class="row-action" data-intern-action="lifecycle" data-intern-name="${internName}">Lifecycle</button>
          <button type="button" class="row-action" data-intern-action="assign" data-intern-name="${internName}">Assign</button>
          <button type="button" class="row-action" data-intern-action="autoAssign" data-intern-name="${internName}">Auto</button>
          <button type="button" class="row-action" data-intern-action="email" data-intern-name="${internName}">Email</button>
          <button type="button" class="row-action" data-intern-action="followup" data-intern-name="${internName}">Follow-up</button>
          <button type="button" class="row-action" data-intern-action="intern10" data-intern-name="${internName}">Intern10</button>
          <button type="button" class="row-action" data-intern-action="capstone" data-intern-name="${internName}">Capstone</button>
        </div>

    }

    function dashboardHtml() {
      const allInterns = getInterns();
      const interns = filteredDashboardInterns(allInterns);
      const rows = interns.map(intern => {
        const blockerClass = intern.blockers.toLowerCase().includes("none") ? "none" : "";
        const status = internProgressStatus(intern);
        const hours = getHoursPerWeek(intern);
        const workload = getWorkloadTier(hours);
        return `
          <tr class="dashboard-row" data-intern-name="${escapeHtml(intern.name)}">
            <td>
              <div class="intern-name">${escapeHtml(intern.name)}</div>
              <div class="role">${escapeHtml(intern.role)}</div>
            </td>
            <td>
              <div class="meta-stack">
                <strong>${escapeHtml(getFunctionalArea(intern))}</strong>
                <span>${escapeHtml(getSubPractice(intern))}</span>
                <span>${escapeHtml(getProjectPhase(intern))} phase, ${escapeHtml(String(getTimelineWeeks(intern)))} weeks</span>
                <span>${escapeHtml(getClientInteraction(intern))} client interaction</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-label">
                <span>${intern.progress}%</span>
                <span>${status.label}</span>
              </div>
              <div class="bar ${status.tone}" aria-label="${intern.progress}% progress">
                <span style="width: ${intern.progress}%"></span>
              </div>
            </td>
            <td>${escapeHtml(intern.completed)}</td>
            <td>${escapeHtml(intern.focus)}</td>
            <td><span class="blocker ${blockerClass}">${escapeHtml(intern.blockers)}</span></td>
            <td>${escapeHtml(intern.nextStep)}</td>
            <td>
              <div class="workload-note">
                <strong>${hours} hrs/week</strong>
                <span>${escapeHtml(workload.label)}</span>
                <span>${escapeHtml(workload.checkpoint)}</span>
              </div>
              ${dashboardRowActionsHtml(intern)}

          </tr>

      }).join("") || `
        <tr class="empty-row">
          <td colspan="8">No interns match the current filters.</td>
        </tr>
      `;

      return `
        ${managerSummaryHtml()}
        <div class="section-title">Intern Progress and Planning Dashboard</div>
        ${dashboardControlsHtml(allInterns, interns)}

              <col class="col-area">
              <col class="col-progress">
              <col class="col-completed">
