    function showDashboard() {
      state.dashboardShown = true;
      removeDashboardQuickActions();
      addAgentMessage(dashboardHtml(), { includeActions: true });
    }

    function detailTextHtml(value) {
      return escapeHtml(value || "None reported.").replace(/\n/g, "<br>");
    }

    function listItemsHtml(items) {
      const values = (items || []).filter(Boolean);
      if (!values.length) return "<p>None identified yet.</p>";
      return `<ul class="capstone-list">${values.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function internDetailHtml(internName) {
      const intern = findInternByName(internName);
      if (!intern) {
        return appendActionOptions("<p>I could not find that intern in the current dashboard.</p>");
      }

      const status = internProgressStatus(intern);
      const assignment = state.assignments[intern.name];
      const dueText = assignment?.dueDate ? `Due ${escapeHtml(assignment.dueDate)}` : "No due date";
      const skills = getSkillRecommendations(intern).slice(0, 4);
      const training = getTrainingModules(intern).slice(0, 4);
      const nextIntern10 = getNextIntern10Requirement(intern);
      const assignmentHtml = assignment
        ? `
            <p><strong>${escapeHtml(assignment.title)}</strong></p>
            <p>${dueText}</p>
            <p>${detailTextHtml(assignment.details)}</p>
          `
        : "<p>No custom assignment has been added yet.</p>";

      return `
        ${managerSummaryHtml()}
        <div class="detail-view">
          <div class="inline-note">Intern detail view</div>
          <div class="detail-header">
            <div class="detail-title">
              <h2>${escapeHtml(intern.name)}</h2>
              <div class="detail-meta">
                <span>${escapeHtml(intern.role)}</span>
                <span>${escapeHtml(getInternTrack(intern))} track</span>
                <span>${escapeHtml(getFunctionalArea(intern))}</span>
                <span>${escapeHtml(getSubPractice(intern))}</span>
                <span>${escapeHtml(getProjectPhase(intern))} phase</span>
                <span>${escapeHtml(String(getTimelineWeeks(intern)))} week timeline</span>
                <span>${escapeHtml(getClientInteraction(intern))} client interaction</span>
                <span>${escapeHtml(String(getHoursPerWeek(intern)))} hrs/week</span>
              </div>
            </div>
            <div class="detail-progress">
              <span class="status-badge ${status.tone}">${escapeHtml(status.label)}</span>
              <strong>${intern.progress}% progress</strong>
              <div class="bar ${status.tone}" aria-label="${intern.progress}% progress">
                <span style="width: ${intern.progress}%"></span>
              </div>
            </div>
          </div>
          <div class="detail-grid">
            <section class="detail-section">
              <h3>Completed work</h3>
              <p>${detailTextHtml(intern.completed)}</p>
            </section>
            <section class="detail-section">
              <h3>Current focus</h3>
              <p>${detailTextHtml(intern.focus)}</p>
            </section>
            <section class="detail-section">
              <h3>Blockers</h3>
              <p><span class="blocker ${isInternBlocked(intern) ? "" : "none"}">${escapeHtml(intern.blockers)}</span></p>
            </section>
            <section class="detail-section">
              <h3>Manager action</h3>
              <p>${detailTextHtml(intern.managerAction)}</p>
            </section>
            <section class="detail-section full">
              <h3>Recommended next step</h3>
              <p>${detailTextHtml(intern.nextStep)}</p>
            </section>
            <section class="detail-section">
              <h3>Skills to learn</h3>
              ${listItemsHtml(skills)}
            </section>
            <section class="detail-section">
              <h3>Training modules</h3>
              ${listItemsHtml(training)}
            </section>
            <section class="detail-section full">
              <h3>Next Intern10 requirement</h3>
              <p><strong>${escapeHtml(nextIntern10.label)}</strong></p>
              <p>${escapeHtml(nextIntern10.assignment)}</p>
              <p>${escapeHtml(nextIntern10.call)}</p>
            </section>
            <section class="detail-section full">
              <h3>Active assignment</h3>
              ${assignmentHtml}
            </section>
          </div>
          <div class="detail-actions" aria-label="Actions for ${escapeHtml(intern.name)}">
            <button type="button" class="row-action" data-intern-action="skills" data-intern-name="${escapeHtml(intern.name)}">Skills</button>
            <button type="button" class="row-action" data-intern-action="training" data-intern-name="${escapeHtml(intern.name)}">Training</button>
            <button type="button" class="row-action" data-intern-action="lifecycle" data-intern-name="${escapeHtml(intern.name)}">Lifecycle</button>
            <button type="button" class="row-action" data-intern-action="assign" data-intern-name="${escapeHtml(intern.name)}">Assign</button>
            <button type="button" class="row-action" data-intern-action="autoAssign" data-intern-name="${escapeHtml(intern.name)}">Auto assign</button>
            <button type="button" class="row-action" data-intern-action="email" data-intern-name="${escapeHtml(intern.name)}">Email</button>
            <button type="button" class="row-action" data-intern-action="followup" data-intern-name="${escapeHtml(intern.name)}">Follow-up</button>
            <button type="button" class="row-action" data-intern-action="intern10" data-intern-name="${escapeHtml(intern.name)}">Intern10</button>
            <button type="button" class="row-action" data-intern-action="capstone" data-intern-name="${escapeHtml(intern.name)}">Capstone</button>
          </div>
        </div>
      `;
    }

    function showInternDetail(internName) {
      addAgentMessage(internDetailHtml(internName), { includeActions: true });
    }

    function emailDraftHtml(intern, index, variant = "standard") {
      const dueDate = "[Due date]";
      const isFollowUp = variant === "followup";
      const draftId = `${variant}-${index}-${intern.name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;
      const subject = isFollowUp
        ? "Follow-up on current focus and blockers"
        : "Next steps for your internship project";
      const skillFocus = getSkillRecommendations(intern).slice(0, 3).join(", ");
      const intern10Next = getNextIntern10Requirement(intern);
      const body = isFollowUp
        ? `
            <p>Hello ${escapeHtml(intern.name.split(" ")[0])},</p>
            <p>I wanted to follow up on your current focus: ${escapeHtml(intern.focus)}</p>
            <ul>
              <li><strong>Progress noted:</strong> ${escapeHtml(intern.completed)}</li>
              <li><strong>Recommended next step:</strong> ${escapeHtml(intern.nextStep)}</li>
              <li><strong>Training or project recommendation:</strong> ${escapeHtml(getTrainingRecommendation(intern))}</li>
              <li><strong>Skill focus:</strong> ${escapeHtml(skillFocus)}</li>
              <li><strong>Intern10 alignment:</strong> ${escapeHtml(intern10Next.label)} - ${escapeHtml(intern10Next.assignment)}</li>
              <li><strong>Due date:</strong> ${dueDate}</li>
            </ul>
            <p>Please reply with any questions, blockers, or support needed to keep this moving.</p>
            <p>Best,<br>Manager</p>
          `
        : `
            <p>Hello ${escapeHtml(intern.name.split(" ")[0])},</p>
            <p>Thank you for the progress you have made so far. You have completed: ${escapeHtml(intern.completed)}</p>
            <ul>
              <li><strong>Next assigned task:</strong> ${escapeHtml(intern.nextStep)}</li>
              <li><strong>Training or project recommendation:</strong> ${escapeHtml(getTrainingRecommendation(intern))}</li>
              <li><strong>Skill focus:</strong> ${escapeHtml(skillFocus)}</li>
              <li><strong>Intern10 alignment:</strong> ${escapeHtml(intern10Next.label)} - ${escapeHtml(intern10Next.assignment)}</li>
              <li><strong>Due date:</strong> ${dueDate}</li>
            </ul>
            <p>Please reply with any questions or blockers that could affect your progress.</p>
            <p>Best,<br>Manager</p>
          `;

      return `
        <div class="draft" data-draft-id="${escapeHtml(draftId)}">
          <div class="draft-title">
            <strong>${escapeHtml(intern.name)}</strong>
            <span class="subject">Subject: ${escapeHtml(subject)}</span>
          </div>
          <div class="draft-body" contenteditable="false" spellcheck="true" aria-label="Editable email draft for ${escapeHtml(intern.name)}">
            ${body}
          </div>
          <div class="draft-actions">
            <span class="draft-status" aria-live="polite"></span>
            <button type="button" class="draft-action edit" data-draft-action="edit" data-draft-id="${escapeHtml(draftId)}">Edit</button>
            <button type="button" class="draft-action send" data-draft-action="send" data-draft-id="${escapeHtml(draftId)}">Send</button>
          </div>
        </div>
      `;
    }

    function uniqueValues(values) {
      return [...new Set((values || []).filter(Boolean))];
    }

    function getSkillRecommendations(intern) {
      const info = getSubPracticeInfo(intern);
      const areaInfo = getFunctionalAreaInfo(intern);
      const track = getInternTrack(intern);
      const phase = getProjectPhase(intern);
      const skills = [...info.skills, ...areaInfo.coreSkills];

      if (track === "Software") {
        skills.push("Technical design notes", "Test evidence", "Error handling");
      }
      if (track === "Data") {
        skills.push("Metric definition", "Data storytelling", "Source assumption validation");
      }
      if (track === "UX") {
        skills.push("Workflow observation", "Journey mapping", "Recommendation prioritization");
      }
      if (track === "Product") {
        skills.push("Backlog writing", "Acceptance criteria", "Stakeholder question framing");
      }
      if (phase === "Discover") {
        skills.push("Problem framing", "Question design", "Current-state documentation");
      }
      if (phase === "Build") {
        skills.push("Incremental delivery", "Quality checks", "Issue documentation");
      }
      if (phase === "Validate") {
        skills.push("UAT thinking", "Feedback synthesis", "Client-ready evidence");
      }
      if (getClientInteraction(intern) === "High") {
        skills.push("Client-safe language", "Meeting notes", "Executive summary writing");
      }
      if (isInternBlocked(intern)) {
        skills.push("Blocker escalation", "Decision log hygiene");
      }

      return uniqueValues(skills).slice(0, 8);
    }

    function getTrainingModules(intern) {
      const info = getSubPracticeInfo(intern);
      const modules = [...info.modules];
      const area = getFunctionalArea(intern);

      if (area === "ERP") modules.push("ERP implementation lifecycle and UAT basics");
      if (area === "SCM") modules.push("Supply chain process and exception management overview");
      if (area === "HCM") modules.push("HCM privacy-aware scenario handling");
      if (area === "Data & AI") modules.push("Data quality, governance, and insight communication");
      if (getClientInteraction(intern) !== "Low") modules.push("Client meeting preparation and action-note writing");
      if (getProjectPhase(intern) === "Validate") modules.push("Readout rehearsal and evidence review");

      return uniqueValues(modules).slice(0, 7);
    }

    function getManagerTrainingModules(intern) {
      const info = getSubPracticeInfo(intern);
      const modules = [...info.managerModules];
      modules.push(`${getFunctionalArea(intern)} project quality bar for ${getProjectPhase(intern).toLowerCase()} phase`);
      modules.push(`${getHoursPerWeek(intern)} hrs/week workload calibration`);
      if (getClientInteraction(intern) === "High") {
        modules.push("Client-safe coaching and pre-read review");
      }
      if (isInternBlocked(intern)) {
        modules.push("Blocker triage and decision log review");
      }

      return uniqueValues(modules).slice(0, 6);
    }

    function getTrainingRecommendation(intern) {
      const modules = getTrainingModules(intern);
      const skills = getSkillRecommendations(intern);
      return `Start with ${modules[0]}, then apply ${skills[0]} through the next ${getFunctionalArea(intern)} deliverable. Manager should reinforce ${getManagerTrainingModules(intern)[0]}.`;
    }

    function draftEmailsForInterns(interns, variant = "standard") {
      if (!interns.length) return;

      const isFollowUp = variant === "followup";
      state.pendingEmailConfirmation = true;
      addAgentMessage(`
        <div class="inline-note">Prepared manager review drafts</div>
        <div class="section-title">${isFollowUp ? "Prepared Focused Follow-Up Drafts" : "Prepared Follow-Up Email Drafts"}</div>
        ${interns.map((intern, index) => emailDraftHtml(intern, index, variant)).join("")}
        <p><strong>Use Edit to adjust a draft, or Send to mark an individual email ready.</strong></p>
      `);
    }

    function internsMentionedInText(text) {
      const lower = text.toLowerCase();
      return getInterns().filter(intern => {
        const fullName = intern.name.toLowerCase();
        const firstName = fullName.split(" ")[0];
        return lower.includes(firstName) || lower.includes(fullName);
      });
    }

    function draftEmails(text) {
      const selected = internsMentionedInText(text);
      const interns = selected.length ? selected : getInterns();
      draftEmailsForInterns(interns);
    }

    function getNextIntern10Requirement(intern) {
      const completed = new Set(getIntern10Completed(intern));
      return intern10Requirements.find(item => !completed.has(item.key)) || intern10Requirements[intern10Requirements.length - 1];
    }

    function assignmentSuggestion(intern, hours = getHoursPerWeek(intern)) {
      const area = getFunctionalArea(intern);
      const track = getInternTrack(intern);
      const workload = getWorkloadTier(hours);
      const prefix = workload.label.replace(" assignment", "");

      if (getSubPractice(intern) === "Oracle ERP Financials") {
        return `${prefix}: build a Payables import validation artifact with field mapping, error states, and review evidence.`;
      }
      if (getSubPractice(intern) === "Oracle SCM Analytics") {
        return `${prefix}: validate SCM KPI definitions and create two dashboard insights with source assumptions.`;
      }
      if (getSubPractice(intern) === "SAP SCM Experience") {
        return `${prefix}: map an SCM exception workflow and recommend three prioritized experience improvements.`;
      }
      if (getSubPractice(intern) === "Workday HCM Transformation") {
        return `${prefix}: refine HCM backlog items with acceptance criteria, training impact, and SME questions.`;
      }
      if (track === "Data") return `${prefix}: validate ${area} metrics and summarize two manager-ready insights.`;
      if (track === "UX") return `${prefix}: document ${area} workflow friction and prioritize improvements.`;
      if (track === "Product") return `${prefix}: refine ${area} requirements with acceptance criteria and open decisions.`;
      return `${prefix}: complete a focused ${area} deliverable tied to the intern's sub-practice.`;
    }

    function getLifecycleSteps(intern) {
      const hours = getHoursPerWeek(intern);
      const workload = getWorkloadTier(hours);
      const areaInfo = getFunctionalAreaInfo(intern);
      const phase = getProjectPhase(intern);
      const client = getClientInteraction(intern);
      const reviewStep = client === "High" ? "Client-safe pre-read and manager approval" : "Manager or SME review";

      return [
        {
          label: "Scope",
          phase: "Plan",
          duration: hours <= 5 ? "1 session" : "1-2 sessions",
          internOutput: `Problem statement for ${getFunctionalArea(intern)} work`,
          managerCheckpoint: "Confirm scope, hours, source material, and definition of done."
        },
        {
          label: "Learn",
          phase: "Discover",
          duration: "1 training block",
          internOutput: getTrainingModules(intern)[0],
          managerCheckpoint: "Check that training connects to the active deliverable."
        },
        {
          label: "Build",
          phase: "Build",
          duration: workload.label,
          internOutput: assignmentSuggestion(intern, hours),
          managerCheckpoint: workload.checkpoint
        },
        {
          label: "Validate",
          phase: "Validate",
          duration: "1 review cycle",
          internOutput: areaInfo.typicalOutputs[0],
          managerCheckpoint: reviewStep
        },
        {
          label: "Share",
          phase: "Readout",
          duration: "Final checkpoint",
          internOutput: "Concise readout with assumptions, decisions, and next steps",
          managerCheckpoint: "Approve final narrative and connect it to Intern10 evidence."
        }
      ].map(step => ({
        ...step,
        current: step.phase === phase || (phase === "Plan" && step.label === "Scope")
      }));
    }

    function assignmentDetails(intern, hours = getHoursPerWeek(intern)) {
      const workload = getWorkloadTier(hours);
      const nextIntern10 = getNextIntern10Requirement(intern);
      const skills = getSkillRecommendations(intern).slice(0, 4);
      const training = getTrainingModules(intern).slice(0, 3);
      const managerTraining = getManagerTrainingModules(intern).slice(0, 3);

      return [
        `Functional area: ${getFunctionalArea(intern)} - ${getFunctionalAreaInfo(intern).label}`,
        `Sub-practice: ${getSubPractice(intern)}`,
        `Phase and timeline: ${getProjectPhase(intern)} phase across ${getTimelineWeeks(intern)} weeks`,
        `Client interaction: ${getClientInteraction(intern)}`,
        `Scaled workload: ${workload.label} for ${hours} hrs/week. ${workload.scope}`,
        `Deliverable: ${assignmentSuggestion(intern, hours)}`,
        `Success criteria: include assumptions, evidence, open questions, manager review notes, and a clear definition of done.`,
        `Skills to learn: ${skills.join("; ")}`,
        `Intern training: ${training.join("; ")}`,
        `Manager training: ${managerTraining.join("; ")}`,
        `Intern10 alignment: ${nextIntern10.label} - ${nextIntern10.assignment}`,
        `Recommended call: ${nextIntern10.call}`,
        `Manager support: ${intern.managerAction}`
      ].join("\n");
    }

    function defaultAssignmentDueDate(intern = null, hoursValue = null) {
      const hours = Number(hoursValue) || (intern ? getHoursPerWeek(intern) : 8);
      const workload = getWorkloadTier(hours);
      const date = new Date();
      date.setDate(date.getDate() + workload.dueDays);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function assignmentPanelHtml(selectedInternName = "") {
      const interns = getInterns();
      const selectedIntern = findInternByName(selectedInternName) || interns[0];
      const options = interns.map(intern => `
        <option value="${escapeHtml(intern.name)}"${selectedIntern && intern.name === selectedIntern.name ? " selected" : ""}>${escapeHtml(intern.name)} - ${escapeHtml(intern.role)}</option>
      `).join("");
      const hours = selectedIntern ? getHoursPerWeek(selectedIntern) : 8;
      const workload = getWorkloadTier(hours);
      const suggested = selectedIntern ? assignmentSuggestion(selectedIntern, hours) : "";
      const details = selectedIntern ? assignmentDetails(selectedIntern, hours) : "";
      const dueDate = defaultAssignmentDueDate(selectedIntern, hours);

      return `
        <div class="inline-note">${selectedIntern ? `New assignment for ${escapeHtml(selectedIntern.name)}` : "New assignment"}</div>
        <div class="section-title">Assign Intern Work</div>
        <div class="assignment-panel">
          <div class="assignment-insight" data-assignment-insight>
            <strong>${escapeHtml(workload.label)} for ${escapeHtml(String(hours))} hrs/week</strong>
            <span>${escapeHtml(workload.scope)}</span>
            <span>${escapeHtml(workload.checkpoint)}. Suggested due date: ${escapeHtml(dueDate)}.</span>
          </div>
          <div class="assignment-grid">
            <div class="assignment-field">
              <label>Intern</label>
              <select data-assignment-field="intern">${options}</select>
            </div>
            <div class="assignment-field">
              <label>Assignment</label>
              <input data-assignment-field="title" type="text" value="${escapeHtml(suggested)}">
            </div>
            <div class="assignment-field">
              <label>Due date</label>
              <input data-assignment-field="dueDate" type="date" value="${escapeHtml(dueDate)}">
            </div>
            <div class="assignment-field">
              <label>Project hrs/week</label>
              <input data-assignment-field="hoursPerWeek" type="number" min="2" max="40" step="1" value="${escapeHtml(String(hours))}">
            </div>
            <div class="assignment-field full">
              <label>Success criteria / notes</label>
              <textarea data-assignment-field="details" placeholder="Add expectations, deliverables, or support needed.">${escapeHtml(details)}</textarea>
            </div>
          </div>
          <div class="assignment-actions">
            <span class="assignment-feedback" aria-live="polite"></span>
            <button type="button" class="assignment-action" data-assignment-action="assign">Assign</button>
          </div>
        </div>
      `;
    }

    function showAssignmentPanel(selectedInternName = "") {
      addAgentMessage(assignmentPanelHtml(selectedInternName), { includeActions: true });
    }

    function selectedOrAllInterns(selectedInternName = "") {
      const selectedIntern = findInternByName(selectedInternName);
      return selectedIntern ? [selectedIntern] : getInterns();
    }

    function skillsHtml(selectedInternName = "") {
      const interns = selectedOrAllInterns(selectedInternName);
      const panels = interns.map(intern => {
        const areaInfo = getFunctionalAreaInfo(intern);
        return `
          <section class="recommendation-panel">
            <h3>${escapeHtml(intern.name)}</h3>
            <p><strong>${escapeHtml(getFunctionalArea(intern))} / ${escapeHtml(getSubPractice(intern))}</strong></p>
            <p>${escapeHtml(areaInfo.projectPattern)}</p>
            ${listItemsHtml(getSkillRecommendations(intern))}
          </section>
        `;
      }).join("");

      return `
        ${managerSummaryHtml()}
        <div class="inline-note">Skill recommendations</div>
        <div class="section-title">${selectedInternName ? "Skills This Intern Should Learn" : "Skills Interns Should Learn"}</div>
        <div class="recommendation-grid">${panels}</div>
      `;
    }

    function showSkills(selectedInternName = "") {
      addAgentMessage(skillsHtml(selectedInternName), { includeActions: true });
    }

    function trainingHtml(selectedInternName = "") {
      const interns = selectedOrAllInterns(selectedInternName);
      const panels = interns.map(intern => `
        <section class="recommendation-panel">
          <h3>${escapeHtml(intern.name)}</h3>
          <p><strong>Intern modules</strong></p>
          ${listItemsHtml(getTrainingModules(intern))}
          <p><strong>Manager enablement</strong></p>
          ${listItemsHtml(getManagerTrainingModules(intern))}
        </section>
      `).join("");

      return `
        ${managerSummaryHtml()}
        <div class="inline-note">Training recommendations by sub-practice</div>
        <div class="section-title">${selectedInternName ? "Training Plan for Intern and Manager" : "Training Plans for Interns and Managers"}</div>
        <div class="recommendation-grid">${panels}</div>
      `;
    }

    function showTraining(selectedInternName = "") {
      addAgentMessage(trainingHtml(selectedInternName), { includeActions: true });
    }

    function lifecycleHtml(selectedInternName = "") {
      const selectedIntern = findInternByName(selectedInternName);

      if (!selectedIntern) {
        const panels = getInterns().map(intern => {
          const currentStep = getLifecycleSteps(intern).find(step => step.current) || getLifecycleSteps(intern)[0];
          return `
            <section class="recommendation-panel">
              <h3>${escapeHtml(intern.name)}</h3>
              <p><strong>${escapeHtml(getProjectPhase(intern))} phase:</strong> ${escapeHtml(currentStep.label)}</p>
              <p>${escapeHtml(currentStep.managerCheckpoint)}</p>
              <p><strong>Process:</strong> Scope, learn, build, validate, share.</p>
            </section>
          `;
        }).join("");

        return `
          ${managerSummaryHtml()}
          <div class="inline-note">Task lifecycle overview</div>
          <div class="section-title">Process to Completion by Intern</div>
          <div class="recommendation-grid">${panels}</div>
        `;
      }

      const steps = getLifecycleSteps(selectedIntern);
      const stepCards = steps.map((step, index) => `
        <section class="lifecycle-step ${step.current ? "current" : ""}">
          <span class="step-kicker">Step ${index + 1} - ${escapeHtml(step.phase)}</span>
          <h3>${escapeHtml(step.label)}</h3>
          <ul>
            <li><strong>Duration:</strong> ${escapeHtml(step.duration)}</li>
            <li><strong>Intern output:</strong> ${escapeHtml(step.internOutput)}</li>
            <li><strong>Manager checkpoint:</strong> ${escapeHtml(step.managerCheckpoint)}</li>
          </ul>
        </section>
      `).join("");

      return `
        ${managerSummaryHtml()}
        <div class="inline-note">Task lifecycle for ${escapeHtml(selectedIntern.name)}</div>
        <div class="section-title">Process to Completion</div>
        <div class="manager-summary">
          <span>${escapeHtml(getFunctionalArea(selectedIntern))}</span>
          <span>${escapeHtml(getSubPractice(selectedIntern))}</span>
          <span>${escapeHtml(getTimelineWeeks(selectedIntern).toString())} weeks</span>
          <span>${escapeHtml(getClientInteraction(selectedIntern))} client interaction</span>
          <span>${escapeHtml(getHoursPerWeek(selectedIntern).toString())} hrs/week</span>
        </div>
        <div class="lifecycle-grid">${stepCards}</div>
      `;
    }

    function showLifecycle(selectedInternName = "") {
      addAgentMessage(lifecycleHtml(selectedInternName), { includeActions: true });
    }

    function intern10RowsHtml(intern) {
      const completed = new Set(getIntern10Completed(intern));
      return intern10Requirements.map((item, index) => {
        const done = completed.has(item.key);
        return `
          <div class="intern10-row">
            <span class="intern10-status ${done ? "done" : ""}">${done ? "OK" : index + 1}</span>
            <div>
              <p><strong>${escapeHtml(item.label)}</strong> ${done ? "Completed" : "Recommended next evidence: " + escapeHtml(item.evidence)}</p>
              <ul class="intern10-list">
                <li><strong>Call:</strong> ${escapeHtml(item.call)}</li>
                <li><strong>Assignment:</strong> ${escapeHtml(item.assignment)}</li>
              </ul>
            </div>
          </div>
        `;
      }).join("");
    }

    function intern10Html(selectedInternName = "") {
      const selectedIntern = findInternByName(selectedInternName);

      if (!selectedIntern) {
        const panels = getInterns().map(intern => {
          const next = getNextIntern10Requirement(intern);
          const completed = getIntern10Completed(intern).length;
          return `
            <section class="recommendation-panel">
              <h3>${escapeHtml(intern.name)}</h3>
              <p><strong>${completed}/10 completed</strong></p>
              <p><strong>Next:</strong> ${escapeHtml(next.label)}</p>
              <p>${escapeHtml(next.assignment)}</p>
              <p>${escapeHtml(next.call)}</p>
            </section>
          `;
        }).join("");

        return `
          ${managerSummaryHtml()}
          <div class="inline-note">Intern10 challenge planning</div>
          <div class="section-title">Recommended Calls and Assignments</div>
          <div class="recommendation-grid">${panels}</div>
        `;
      }

      return `
        ${managerSummaryHtml()}
        <div class="inline-note">Intern10 challenge for ${escapeHtml(selectedIntern.name)}</div>
        <div class="section-title">Calls, Assignments, and Evidence</div>
        <div class="recommendation-panel">${intern10RowsHtml(selectedIntern)}</div>
      `;
    }

    function showIntern10(selectedInternName = "") {
      addAgentMessage(intern10Html(selectedInternName), { includeActions: true });
    }

    function autoAssignWork(selectedInternName = "") {
      const interns = selectedOrAllInterns(selectedInternName);
      const rows = interns.map(intern => {
        const hours = getHoursPerWeek(intern);
        const dueDate = defaultAssignmentDueDate(intern, hours);
        const title = assignmentSuggestion(intern, hours);
        const details = assignmentDetails(intern, hours);

        state.assignments[intern.name] = {
          title,
          details,
          dueDate,
          hoursPerWeek: hours,
          projectPhase: getProjectPhase(intern),
          clientInteraction: getClientInteraction(intern),
          timelineWeeks: getTimelineWeeks(intern)
        };

        return `
          <tr>
            <td>
              <div class="intern-name">${escapeHtml(intern.name)}</div>
              <div class="role">${escapeHtml(getSubPractice(intern))}</div>
            </td>
            <td>${escapeHtml(String(hours))} hrs/week</td>
            <td>${escapeHtml(getWorkloadTier(hours).label)}</td>
            <td>${escapeHtml(title)}</td>
            <td>${escapeHtml(dueDate)}</td>
          </tr>
        `;
      }).join("");

      addAgentMessage(`
        ${managerSummaryHtml()}
        <div class="inline-note">Auto assigned by expected project hours</div>
        <div class="section-title">${selectedInternName ? "Scaled Assignment Created" : "Scaled Assignments Created"}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Intern</th>
                <th>Hours</th>
                <th>Scale</th>
                <th>Assignment</th>
                <th>Due</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `);
      showDashboard();
    }

    function capstoneHtml(selectedInternName = "") {
      const selectedIntern = findInternByName(selectedInternName);
      const interns = selectedIntern ? [selectedIntern] : getInterns();
      const rows = interns.map(intern => `
        <tr>
          <td>
            <div class="intern-name">${escapeHtml(intern.name)}</div>
            <div class="role">${escapeHtml(intern.role)} - ${escapeHtml(getFunctionalArea(intern))} / ${escapeHtml(getSubPractice(intern))}</div>
          </td>
          <td>${escapeHtml(getCapstoneIdea(intern))}</td>
          <td>${escapeHtml(getCapstoneManagerAction(intern))}</td>
        </tr>
      `).join("");

      addAgentMessage(`
        <div class="inline-note">Recommendations for manager review</div>
        <div class="section-title">${selectedIntern ? `Capstone Recommendation for ${escapeHtml(selectedIntern.name)}` : "Capstone Recommendations"}</div>
        <div class="table-wrap">
          <table class="capstone-table">
            <colgroup>
              <col class="col-capstone-intern">
              <col class="col-capstone-recommendation">
              <col class="col-capstone-action">
            </colgroup>
            <thead>
              <tr>
                <th>Intern</th>
                <th>Recommended capstone</th>
                <th>Suggested manager action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `);
    }

    function getCapstoneIdea(intern) {
      return capstoneIdeas[getSubPractice(intern)]
        || capstoneIdeas[getFunctionalArea(intern)]
        || "Create a focused project that turns current internship work into a practical team asset.";
    }

    function getCapstoneManagerAction(intern) {
      const area = getFunctionalArea(intern);
      if (intern.progress >= 85) return `Give autonomy on final structure and schedule a readout with the ${area} process stakeholders.`;
      if (intern.progress >= 65) return `Clarify ${area} scope, define success criteria, and set one mid-point checkpoint.`;
      return `Narrow the ${area} project to one meaningful deliverable and provide weekly feedback until blockers are resolved.`;
    }

    function generalHelp() {
      addAgentMessage(`
        <p>I can help with intern tracking, skill recommendations, training plans, hour-scaled assignments, task lifecycles, Intern10 planning, capstone ideas, and follow-up email drafts.</p>
        <p>Try: <strong>recommend skills</strong>, <strong>recommend training</strong>, <strong>task lifecycle</strong>, <strong>auto assign by hours</strong>, <strong>Intern10 plan</strong>, or <strong>show dashboard</strong>.</p>
      `);
    }

    async function handlePostVerification(text) {
      const lower = text.toLowerCase();
      const names = parseCustomInternNames(text);
      if (names.length) {
        state.customInternNames = names;
        addAgentMessage(`<p>Updated the dashboard to use ${names.length} provided intern name${names.length === 1 ? "" : "s"}.</p>`);
        showDashboard();
        return;
      }

      if (state.pendingEmailConfirmation && /\b(yes|confirm|ready|please do|go ahead)\b/i.test(lower)) {
        state.pendingEmailConfirmation = false;
        addAgentMessage("<p><strong>The email drafts are marked as ready for manager review.</strong></p>");
        return;
      }

      if (state.pendingEmailConfirmation && /\b(no|do not|don't|cancel|not now)\b/i.test(lower)) {
        state.pendingEmailConfirmation = false;
        addAgentMessage("<p>No status change was made. The email drafts remain available in this chat for review.</p>");
        return;
      }

      const selectedInterns = internsMentionedInText(text);
      const selectedInternName = selectedInterns[0]?.name || "";

      if (/\b(auto[- ]?assign|auto assign|assign by hours|scale work|scaled assignment|hours)\b/i.test(lower)) {
        autoAssignWork(selectedInternName);
        return;
      }

      if (/\b(skill|skills|learn|capabilit|growth area|gap)\b/i.test(lower)) {
        showSkills(selectedInternName);
        return;
      }

      if (/\b(training|module|modules|learning|enablement|sub[- ]?practice)\b/i.test(lower)) {
        showTraining(selectedInternName);
        return;
      }

      if (/\b(lifecycle|life cycle|process to completion|completion process|phase|timeline|milestone)\b/i.test(lower)) {
        showLifecycle(selectedInternName);
        return;
      }

      if (/\b(intern10|intern 10|challenge|shadow call|sme chat)\b/i.test(lower)) {
        showIntern10(selectedInternName);
        return;
      }

      if (/\b(assign|assignment|new work|new task|task)\b/i.test(lower)) {
        showAssignmentPanel(selectedInternName);
        return;
      }

      if (/\b(email|emails|contact|message|follow[- ]?up|send)\b/i.test(lower)) {
        draftEmails(text);
        return;
      }

      if (/\b(capstone|final project|portfolio project)\b/i.test(lower)) {
        capstoneHtml(selectedInternName);
        return;
      }

      const detailRequest = /\b(detail|details|profile)\b/i.test(lower) || (/\bview\b/i.test(lower) && internsMentionedInText(text).length);
      if (detailRequest) {
        const selected = internsMentionedInText(text);
        if (selected.length) {
          showInternDetail(selected[0].name);
        } else {
          addAgentMessage("<p>Which intern would you like to view? You can also open details from the dashboard row actions.</p>");
        }
        return;
      }

      if (/\b(dashboard|progress|status|blocker|blockers|recommendation|recommendations|interns)\b/i.test(lower)) {
        showDashboard();
        return;
      }

      const handledByAi = await requestAiResponse(text);
      if (!handledByAi) {
        generalHelp();
      }
    }

    function boot() {
      addMessage("agent", `
        <p><strong>Welcome to AskBlue.</strong></p>
        <p>I&rsquo;m here to help you keep intern teams aligned with clear progress visibility, skill recommendations, training plans, scaled project work, task lifecycles, and follow-up support.</p>
      `);
      openVerificationModal();
    }

    function setDraftEditing(draft, isEditing) {
      const body = draft.querySelector(".draft-body");
      const editButton = draft.querySelector('[data-draft-action="edit"]');
      const status = draft.querySelector(".draft-status");
      if (!body || !editButton) return;

      draft.classList.toggle("editing", isEditing);
      body.setAttribute("contenteditable", isEditing ? "true" : "false");
      editButton.textContent = isEditing ? "Save" : "Edit";

      if (status) {
        status.textContent = isEditing ? "Editing draft" : "Edits saved";
      }

      if (isEditing) {
        body.focus();
      }

      scrollToBottom();
    }

    function handleDraftAction(button, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (button.disabled || button.dataset.draftAction === "sent") return;

      const draft = button.closest(".draft");
      if (!draft) return;

      const action = button.dataset.draftAction;
      if (draft.dataset.draftId !== button.dataset.draftId) return;

      const status = draft.querySelector(".draft-status");

      if (action === "edit") {
        setDraftEditing(draft, !draft.classList.contains("editing"));
        return;
      }

      if (action === "send") {
        if (draft.classList.contains("editing")) {
          setDraftEditing(draft, false);
        }

        button.textContent = "Sending";
        button.disabled = true;
        button.classList.add("loading");
        button.setAttribute("aria-busy", "true");
        if (status) {
          status.textContent = "Sending...";
        }
        scrollToBottom();

        runLater(() => {
          button.classList.remove("loading");
          button.classList.add("sent");
          button.removeAttribute("aria-busy");
          button.dataset.draftAction = "sent";
          button.textContent = "Sent!";
          if (status) {
            status.textContent = "";
          }
          scrollToBottom();
        }, 850);
      }
    }

    function assignmentValues(panel) {
      const internName = (panel.querySelector('[data-assignment-field="intern"]')?.value || "").trim();
      const intern = findInternByName(internName);
      const hours = Number(panel.querySelector('[data-assignment-field="hoursPerWeek"]')?.value || "");
      return {
        internName,
        title: (panel.querySelector('[data-assignment-field="title"]')?.value || "").trim(),
        dueDate: (panel.querySelector('[data-assignment-field="dueDate"]')?.value || "").trim(),
        details: (panel.querySelector('[data-assignment-field="details"]')?.value || "").trim(),
        hoursPerWeek: Number.isFinite(hours) && hours > 0 ? Math.round(hours) : (intern ? getHoursPerWeek(intern) : 8),
        projectPhase: intern ? getProjectPhase(intern) : "Plan",
        clientInteraction: intern ? getClientInteraction(intern) : "Medium",
        timelineWeeks: intern ? getTimelineWeeks(intern) : 4
      };
    }

    function handleAssignmentAction(button, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (button.disabled) return;

      const panel = button.closest(".assignment-panel");
      if (!panel) return;

      const feedback = panel.querySelector(".assignment-feedback");
      const values = assignmentValues(panel);

      if (!values.internName || !values.title) {
        if (feedback) {
          feedback.textContent = "Select an intern and enter an assignment.";
          feedback.className = "assignment-feedback error";
        }
        scrollToBottom();
        return;
      }

      state.assignments[values.internName] = {
        title: values.title,
        details: values.details,
        dueDate: values.dueDate,
        hoursPerWeek: values.hoursPerWeek,
        projectPhase: values.projectPhase,
        clientInteraction: values.clientInteraction,
        timelineWeeks: values.timelineWeeks
      };

      button.textContent = "Assigned";
      button.disabled = true;
      if (feedback) {
        feedback.textContent = `Assigned to ${values.internName}`;
        feedback.className = "assignment-feedback success";
      }

      const dueText = values.dueDate ? ` Due date: ${escapeHtml(values.dueDate)}.` : "";
      addAgentMessage(`
        <p><strong>Assignment added for ${escapeHtml(values.internName)}.</strong></p>
        <p>${escapeHtml(values.title)}${dueText} Project work: ${escapeHtml(String(values.hoursPerWeek))} hrs/week.</p>
      `);
      showDashboard();
      scrollToBottom();
    }

    function handleAssignmentInternChange(select) {
      const panel = select.closest(".assignment-panel");
      if (!panel) return;

      const intern = getInterns().find(candidate => candidate.name === select.value);
      if (!intern) return;
      const hoursInput = panel.querySelector('[data-assignment-field="hoursPerWeek"]');
      if (hoursInput) {
        hoursInput.value = getHoursPerWeek(intern);
      }
      refreshAssignmentScale(panel);
    }

    function refreshAssignmentScale(panel) {
      const internName = (panel.querySelector('[data-assignment-field="intern"]')?.value || "").trim();
      const intern = getInterns().find(candidate => candidate.name === internName);
      if (!intern) return;

      const hoursInput = panel.querySelector('[data-assignment-field="hoursPerWeek"]');
      const parsedHours = Number(hoursInput?.value || "");
      const hours = Number.isFinite(parsedHours) && parsedHours > 0 ? Math.max(2, Math.min(40, Math.round(parsedHours))) : getHoursPerWeek(intern);
      const workload = getWorkloadTier(hours);
      const titleInput = panel.querySelector('[data-assignment-field="title"]');
      const detailsInput = panel.querySelector('[data-assignment-field="details"]');
      const dueDateInput = panel.querySelector('[data-assignment-field="dueDate"]');
      const insight = panel.querySelector("[data-assignment-insight]");

      if (hoursInput) {
        hoursInput.value = hours;
      }
      if (titleInput) {
        titleInput.value = assignmentSuggestion(intern, hours);
      }
      if (detailsInput) {
        detailsInput.value = assignmentDetails(intern, hours);
      }
      if (dueDateInput) {
        dueDateInput.value = defaultAssignmentDueDate(intern, hours);
      }
      if (insight) {
        const dueDate = dueDateInput?.value || defaultAssignmentDueDate(intern, hours);
        insight.innerHTML = `
          <strong>${escapeHtml(workload.label)} for ${escapeHtml(String(hours))} hrs/week</strong>
          <span>${escapeHtml(workload.scope)}</span>
          <span>${escapeHtml(workload.checkpoint)}. Suggested due date: ${escapeHtml(dueDate)}.</span>
        `;
      }
    }

    function handleDashboardFilterChange(select, event) {
      if (event) {
        event.stopPropagation();
      }

      const filterName = select.dataset.dashboardFilter;
      if (!filterName || !(filterName in state.dashboardFilters)) return;

      state.dashboardFilters[filterName] = select.value;
      const bubble = select.closest(".message");
      const updatedHtml = appendActionOptions(dashboardHtml());
      if (bubble) {
        renderBubbleContent(bubble, updatedHtml);
      } else {
        showDashboard();
      }
    }

    function handleInternTableAction(button, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const internName = button.dataset.internName || "";
      const intern = findInternByName(internName);
      if (!intern) return;

      const action = button.dataset.internAction;
      if (action === "details") showInternDetail(intern.name);
      if (action === "skills") showSkills(intern.name);
      if (action === "training") showTraining(intern.name);
      if (action === "lifecycle") showLifecycle(intern.name);
      if (action === "assign") showAssignmentPanel(intern.name);
      if (action === "autoAssign") autoAssignWork(intern.name);
      if (action === "email") draftEmailsForInterns([intern]);
      if (action === "followup") draftEmailsForInterns([intern], "followup");
      if (action === "intern10") showIntern10(intern.name);
      if (action === "capstone") capstoneHtml(intern.name);
    }

    if (verificationForm) {
      verificationForm.addEventListener("submit", handleVerificationFormSubmit);
    }

    verificationInputs.forEach(field => {
      field.addEventListener("input", clearVerificationError);
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();

      if (!state.verification.complete) {
        input.value = "";
        openVerificationModal();
        return;
      }

      if (!text) return;

      addUserMessage(text);
      input.value = "";
      handlePostVerification(text);
    });

    messages.addEventListener("click", event => {
      const internActionButton = event.target.closest("button[data-intern-action]");
      if (internActionButton) {
        handleInternTableAction(internActionButton, event);
        return;
      }

      const assignmentButton = event.target.closest("button[data-assignment-action]");
      if (assignmentButton) {
        handleAssignmentAction(assignmentButton, event);
        return;
      }

      const draftButton = event.target.closest("button[data-draft-action]");
      if (draftButton) {
        handleDraftAction(draftButton, event);
        return;
      }

      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const action = button.dataset.action;
      if (action === "skills") showSkills();
      if (action === "training") showTraining();
      if (action === "lifecycle") showLifecycle();
      if (action === "intern10") showIntern10();
      if (action === "emails") draftEmails("draft follow-up emails");
      if (action === "assignments") showAssignmentPanel();
      if (action === "autoAssign") autoAssignWork();
      if (action === "capstones") capstoneHtml();
      if (action === "dashboard") showDashboard();
    });

    messages.addEventListener("change", event => {
      const dashboardSelect = event.target.closest('select[data-dashboard-filter]');
      if (dashboardSelect) {
        handleDashboardFilterChange(dashboardSelect, event);
        return;
      }

      const internSelect = event.target.closest('select[data-assignment-field="intern"]');
      if (internSelect) {
        handleAssignmentInternChange(internSelect);
        return;
      }

      const hoursInput = event.target.closest('input[data-assignment-field="hoursPerWeek"]');
      if (hoursInput) {
        const panel = hoursInput.closest(".assignment-panel");
        if (panel) refreshAssignmentScale(panel);
      }
    });

    boot();
  </script>
</body>
</html>
